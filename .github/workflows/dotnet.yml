name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore application
        run: dotnet restore src/StockManagement/StockManagement.csproj
      - name: Build application
        run: dotnet build src/StockManagement/StockManagement.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/StockManagement.Tests/StockManagement.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/StockManagement.Tests/StockManagement.Tests.csproj --configuration Release --no-restore
      - name: Smoke test console app
        run: |
          printf '0\n' | dotnet run --project src/StockManagement/StockManagement.csproj --configuration Release --no-build > output.txt
          grep -q "Goodbye!" output.txt
